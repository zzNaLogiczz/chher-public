// 真机验收用的临时 Gradle 初始化脚本:把 applicationId 改成独立测试包,
// 与手机上的原应用(com.chhreader.chh_app,签名不同)并存,不动原应用和它的数据。
//
// 用法(只在验收期间放进 init.d,结束后删除):
//   mkdir -p ~/.gradle/init.d
//   cp tool/preview_package.gradle ~/.gradle/init.d/chh-preview.gradle
//   ... flutter run --profile / flutter build apk ...
//   rm ~/.gradle/init.d/chh-preview.gradle
//
// 仓库里的正式 applicationId 不改。
allprojects {
    afterEvaluate { project ->
        if (project.name == 'app' && project.extensions.findByName('android') != null) {
            project.android.defaultConfig.applicationId = 'com.chhreader.chh_app.preview'
            // 只改构建目录中的清单副本，让测试包在桌面上可辨，保留正式包名称。
            def sourceManifest = project.file('src/main/AndroidManifest.xml')
            def previewManifest = new File(project.layout.buildDirectory.get().asFile,
                    'preview/AndroidManifest.xml')
            previewManifest.parentFile.mkdirs()
            previewManifest.setText(sourceManifest.getText('UTF-8').replace(
                    'android:label="Chher"', 'android:label="Chher-preview"'), 'UTF-8')
            project.android.sourceSets.main.manifest.srcFile(previewManifest)
        }
    }
}
